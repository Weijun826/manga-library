name: Release Manga Library

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 漫畫書庫 v__VERSION__
          releaseBody: Windows 漫畫收藏管理程式。安裝或更新前請先關閉正在執行的漫畫書庫。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: false
          releaseAssetNamePattern: manga-library_[version]_[arch][setup].[ext]
      - name: Publish updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $signaturePath = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe.sig | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signaturePath) { throw "NSIS updater signature was not produced" }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if (-not $signature) { throw "NSIS updater signature is empty" }
          $assetName = "manga-library_${version}_x64-setup.exe"
          $installerPath = $signaturePath -replace '\.sig$', ''
          Copy-Item -LiteralPath $installerPath -Destination $assetName
          Copy-Item -LiteralPath $signaturePath -Destination "$assetName.sig"
          gh release upload "$env:GITHUB_REF_NAME" $assetName "$assetName.sig" --clobber --repo "$env:GITHUB_REPOSITORY"
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/$assetName"
          $platform = @{ signature = $signature; url = $assetUrl }
          $manifest = @{
            version = $version
            notes = "漫畫書庫 $version：安全的 Windows 桌面更新。"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = $platform
              "windows-x86_64-nsis" = $platform
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content latest.json -Encoding utf8NoBOM
          Get-Content latest.json -Raw | ConvertFrom-Json | Out-Null
          gh release upload "$env:GITHUB_REF_NAME" latest.json --clobber --repo "$env:GITHUB_REPOSITORY"
